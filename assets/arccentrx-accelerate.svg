<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Accelerate</title>
  <desc>Seven vertical lines of increasing weight and height left to right, transitioning from navy to teal, representing momentum building</desc>
  <rect width="800" height="800" fill="#FFFFFF"/>
  <line x1="88"  y1="530" x2="88"  y2="270" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="192" y1="510" x2="192" y2="250" stroke="#1B2A4A" stroke-width="3"/>
  <line x1="300" y1="490" x2="300" y2="220" stroke="#1B2A4A" stroke-width="5"/>
  <line x1="414" y1="460" x2="414" y2="190" stroke="#1B2A4A" stroke-width="7"/>
  <line x1="534" y1="430" x2="534" y2="150" stroke="#1B2A4A" stroke-width="10"/>
  <line x1="646" y1="390" x2="646" y2="100" stroke="#1D9E75" stroke-width="14"/>
  <line x1="740" y1="340" x2="740" y2="60"  stroke="#1D9E75" stroke-width="20"/>
</svg>
